<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Arrgus">
<title>Arrgus</title>
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="apple-touch-icon" href="/app/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/app/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css?v={{UI}}">
<style>
  [hidden] { display: none !important; }
  html { height: 100%; background: #050b12; }
  body.app { position: fixed; top: 0; left: 0; right: 0; height: var(--app-h, 100%); margin: 0; padding: 0; overflow: hidden; display: flex; flex-direction: column; font-size: 15px;
             overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
  body.app input, body.app textarea, body.app pre, body.app .t-text, body.app .sel { -webkit-user-select: text; user-select: text; }
  body.app textarea, body.app input { font-size: 16px; }

  /* top bar */
  .ab-top { flex: none; display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top) + 12px) 14px 12px;
            background: #050b12; border-bottom: 1px solid var(--line); z-index: 5; }
  .ab-top .emblem { width: 34px; height: 34px; filter: none; }
  .ab-top .emblem *, .ab-top .dot { animation: none !important; }      /* crisp: no glow or motion in the top bar */
  .ab-top .wm { font: 700 18px/1 var(--display); letter-spacing: .22em; color: var(--accent-hi); text-shadow: none;
                -webkit-font-smoothing: subpixel-antialiased; }
  .ab-top .grow { flex: 1; }
  .ab-top .status { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 600; color: var(--text); }
  .ab-top .status .dot { width: 10px; height: 10px; box-shadow: none !important; filter: none !important; }
  .iconbtn { display: inline-grid; place-items: center; width: 40px; height: 40px; color: var(--text); border: 1px solid transparent; background: none; }
  .iconbtn:active { color: var(--accent-hi); border-color: var(--line-hi); }
  .iconbtn svg { width: 22px; height: 22px; }

  /* main scroll area */
  main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; position: relative;
         padding: 12px max(14px, env(safe-area-inset-left)) 20px max(14px, env(safe-area-inset-right)); }
  .view { max-width: 680px; margin: 0 auto; }
  .card { padding: 14px; margin-bottom: 12px; }
  .card::after { inset: 3px; }
  h2 { font-size: 13px; margin-bottom: 10px; }
  .ptr { height: 0; overflow: hidden; display: grid; place-items: center; color: var(--muted); font-size: 13px; transition: height .2s; }
  .ptr.pulling { transition: none; }
  .offline { margin: 0 0 12px; padding: 10px 12px; border: 1px solid #f0b44c66; background: #f0b44c12; color: var(--warn); font-size: 13.5px; }

  /* tab bar */
  .ab-tabs { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); background: #02060af0; backdrop-filter: blur(10px);
             -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); z-index: 5;
             /* never closer than 26px to the bottom edge: clear of the rounded corners and home indicator */
             padding: 4px max(10px, env(safe-area-inset-left)) calc(max(env(safe-area-inset-bottom), 22px) + 4px) max(10px, env(safe-area-inset-right)); }
  .ab-tabs button { all: unset; position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0 4px;
                    color: var(--muted); font-size: 11px; letter-spacing: .02em; cursor: pointer; }
  .ab-tabs button svg { width: 24px; height: 24px; }
  .ab-tabs button[aria-selected="true"] { color: var(--accent-hi); }
  .ab-tabs button[aria-selected="true"]::before { content: ""; position: absolute; top: -5px; left: 30%; right: 30%; height: 2px; background: var(--accent); }
  .ab-tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .tbadge { position: absolute; top: 2px; left: calc(50% + 7px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
            background: var(--fail); color: #fff; font: 700 10px/16px system-ui, sans-serif; text-align: center; }
  .tbadge.info { background: var(--sapphire); }

  /* home */
  .hero2 { display: flex; align-items: center; gap: 14px; }
  .hero2 .dot { width: 16px; height: 16px; }
  .hero2 .big { font: 600 20px/1.25 var(--display); }
  .hero2 .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .actions .btn { justify-content: center; min-height: 50px; white-space: normal; text-align: center; }
  .actions .btn.primary, .actions .wide { grid-column: 1 / -1; }
  .install { border-color: #2fb8a866; }

  /* apps */
  .launcher { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 10px; }
  .launcher a { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 4px 12px; text-decoration: none; color: var(--text);
                background: linear-gradient(180deg, #153440, #10252f); border: 1px solid var(--line); font-size: 12.5px; font-weight: 600; text-align: center; overflow-wrap: anywhere; }
  .launcher a:active { border-color: var(--accent); filter: brightness(1.15); }
  .launcher img, .launcher .noicon { width: 40px; height: 40px; object-fit: contain; }
  .launcher .noicon { display: grid; place-items: center; border: 1px solid var(--line-hi); font: 600 18px var(--display); color: var(--accent); }

  /* lists */
  .row { gap: 10px; padding: 11px 0; }
  .tap { cursor: pointer; }
  .tap:active { background: #ffffff08; }
  .chev { color: var(--muted); align-self: center; font-size: 18px; }
  .events-feed .row .ts { font-size: 12px; }
  .ev-detail { display: none; } .row.open .ev-detail { display: block; }

  /* system */
  .sys { grid-template-columns: 1fr 1fr; gap: 8px; }
  .sys .tile2:has(.dline) { grid-column: 1 / -1; }
  @media (max-width: 340px) { .sys { grid-template-columns: 1fr; } }

  /* sheets: full-screen panels */
  .sheet { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; background: var(--bg0);
           transform: translateY(100%); transition: transform .28s cubic-bezier(.2,.8,.2,1); visibility: hidden; }
  .sheet.open { transform: none; visibility: visible; }
  .sheet-h { flex: none; display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top) + 6px) 8px 6px 14px;
             border-bottom: 1px solid var(--line); background: var(--card); }
  .sheet-h .title { flex: 1; min-width: 0; font: 600 16px/1.3 var(--display); color: var(--accent-hi); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sheet-b { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; padding: 14px; }
  .sheet-f { flex: none; padding: 10px 12px calc(max(env(safe-area-inset-bottom), 20px) + 10px); border-top: 1px solid var(--line); background: var(--card); }
  .composer { display: flex; gap: 8px; align-items: flex-end; }
  .composer textarea { min-height: 44px; max-height: 40vh; height: 44px; resize: none; }
  .composer .btn { min-height: 44px; }
  .note { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
  .turn { border-bottom-color: #ffffff12; }
  .t-user { max-width: 88%; }
  .bigcount { margin: 30px 0 10px; }
  .toast { bottom: calc(max(env(safe-area-inset-bottom), 22px) + 76px); max-width: calc(100vw - 32px); width: max-content; text-align: center; z-index: 40; }
</style>
</head>
<body class="app">
<header class="ab-top">
  <svg class="emblem" viewBox="0 0 64 64" aria-hidden="true" fill="none">
    <defs><radialGradient id="eg-iris" cx="45%" cy="40%" r="62%"><stop offset="0" stop-color="#3fd6c3"/><stop offset=".55" stop-color="#2a8fd0"/><stop offset="1" stop-color="#1a3f9a"/></radialGradient></defs>
    <circle cx="32" cy="32" r="29" stroke="#d9b45a" stroke-width="2" opacity=".7"/>
    <path d="M32 1.5v6M32 56.5v6M1.5 32h6M56.5 32h6" stroke="#d9b45a" stroke-width="2.4" stroke-linecap="round"/>
    <g class="lid"><path d="M13 32c5.2-8 11.6-12 19-12s13.8 4 19 12c-5.2 8-11.6 12-19 12s-13.8-4-19-12z" stroke="#d9b45a" stroke-width="2.6" stroke-linejoin="round" fill="#071a20"/>
      <g class="pupil"><circle cx="32" cy="32" r="8.4" fill="#d9b45a"/><circle cx="32" cy="32" r="7" fill="url(#eg-iris)"/>
        <circle cx="32" cy="32" r="3.1" fill="#06101f"/><circle cx="34.4" cy="29.6" r="1.4" fill="#fff6dc"/></g></g>
  </svg>
  <span class="wm">ARRGUS</span>
  <span class="grow"></span>
  <span class="status" id="top-status"><span class="dot" id="top-dot"></span><span id="top-label">…</span></span>
  <a class="iconbtn" href="/settings?from=app" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </a>
</header>

<main id="main">
  <div class="ptr" id="ptr"><span id="ptr-text">Pull to refresh</span></div>
  <div class="view">
    <div class="offline" id="offline" hidden></div>
    <section id="v-home"></section>
    <section id="v-apps" hidden></section>
    <section id="v-ai" hidden></section>
    <section id="v-system" hidden></section>
    <section id="v-activity" hidden></section>
  </div>
</main>

<nav class="ab-tabs" role="tablist" aria-label="Sections">
  <button role="tab" data-tab="home" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3 11 12 3l9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home<span class="tbadge" id="badge-home" hidden></span></button>
  <button role="tab" data-tab="apps" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="3.5" width="7" height="7"/><rect x="13.5" y="3.5" width="7" height="7"/><rect x="3.5" y="13.5" width="7" height="7"/><rect x="13.5" y="13.5" width="7" height="7"/></svg>Apps</button>
  <button role="tab" data-tab="ai" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8.5 10.5h.01M12 10.5h.01M15.5 10.5h.01" stroke-width="2.4" stroke-linecap="round"/></svg>AI<span class="tbadge info" id="badge-ai" hidden></span></button>
  <button role="tab" data-tab="system" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>System</button>
  <button role="tab" data-tab="activity" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>Activity</button>
</nav>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet-h"><div class="title" id="sheet-title"></div>
    <button class="iconbtn" id="sheet-close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="sheet-b" id="sheet-b"></div>
  <div class="sheet-f" id="sheet-f" hidden></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const BOOT = {{BOOT_JSON}};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function safeGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function safeSet(k, v) { try { localStorage.setItem(k, v); } catch {} }
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 3500); }
function ago(iso) {
  if (!iso) return "never";
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return Math.round(s) + "s ago";
  if (s < 3600) return Math.round(s / 60) + "m ago";
  if (s < 86400) return (s / 3600).toFixed(1) + "h ago";
  return (s / 86400).toFixed(1) + "d ago";
}
function when(iso) {
  if (!iso) return "";
  const d = new Date(iso), today = new Date().toDateString() === d.toDateString();
  return today ? d.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"})
               : d.toLocaleDateString([], {month: "short", day: "numeric"}) + " " + d.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
}
function bytes(n) {
  if (n == null) return "?";
  const u = ["B", "KB", "MB", "GB", "TB", "PB"]; let i = 0;
  while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
  return (n >= 100 || i === 0 ? Math.round(n) : n.toFixed(n >= 10 ? 1 : 2)) + " " + u[i];
}
const lvl = (v, warn, crit) => v == null ? "" : v >= crit ? "fail" : v >= warn ? "warn" : "ok";
const bar = (pct, cls = "", extra = "") => `<div class="bar ${cls} ${extra}"><i style="width:${Math.max(0, Math.min(100, pct || 0))}%"></i></div>`;

async function api(path, body, timeoutMs = 10000) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), timeoutMs);
  const opt = body === undefined ? {cache: "no-store", signal: ctl.signal}
    : {method: "POST", headers: {"X-Arrgus": "1", "Content-Type": "application/json"}, body: JSON.stringify(body), signal: ctl.signal};
  try {
    const r = await fetch(path, opt);
    let j = {}; try { j = await r.json(); } catch {}
    if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
    return j;
  } catch (e) {
    if (e.name === "AbortError") throw new Error("Arrgus didn't answer in time");
    throw e;
  } finally { clearTimeout(t); }
}

// ---------- state, refresh, offline ----------
const ss = {get: (k) => { try { return sessionStorage.getItem(k); } catch { return null; } },
            set: (k, v) => { try { sessionStorage.setItem(k, v); } catch {} }};
let S = null, online = true, pollTimer = null, tab = ss.get("arrgus.app.tab") || "home";
const openGroups = {}, openEvents = new Set(), spacePinned = new Set();
try { const c = JSON.parse(safeGet("arrgus.app.last") || "null"); if (c && c.box === BOOT.box) S = c; } catch {}

async function refresh(manual) {
  clearTimeout(pollTimer);
  try {
    const s = await api("/api/status");
    S = s; online = true;
    safeSet("arrgus.app.last", JSON.stringify(s));
    if (manual) toast("Updated");
    if (S.ui && BOOT.ui && S.ui !== BOOT.ui && !sheetOpen()) return location.reload();
  } catch (e) {
    online = false;
    if (manual) toast("Can't reach Arrgus");
  }
  render();
  if (document.visibilityState === "visible") {
    const busy = S && (S.checking || (S.updates && S.updates.progress && S.updates.progress.active) || (S.reboot && (S.reboot.scheduled || S.reboot.rebooting))
                       || S.actions.some((a) => a.status === "running"));
    pollTimer = setTimeout(refresh, !online ? 15000 : busy ? 3000 : 10000);
  }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(); else clearTimeout(pollTimer); });
window.addEventListener("online", () => refresh());

// ---------- tabs ----------
function showTab(t) {
  tab = t; ss.set("arrgus.app.tab", t);
  document.querySelectorAll(".ab-tabs [data-tab]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
  ["home", "apps", "ai", "system", "activity"].forEach((v) => $("v-" + v).hidden = v !== t);
  $("main").scrollTop = 0;
  render();
}
document.querySelectorAll(".ab-tabs [data-tab]").forEach((b) => b.onclick = () => showTab(b.dataset.tab));

// ---------- rendering ----------
const LABEL = {ok: "All systems healthy", warn: "Healthy, with warnings", fail: "Problems detected", unknown: "No check yet"};
const SHORT = {ok: "Healthy", warn: "Warnings", fail: "Problems", unknown: "…"};
function render() {
  $("offline").hidden = online;
  if (!online) $("offline").innerHTML = S
    ? `Can't reach Arrgus. Showing what it reported ${esc(ago(S.now))}. Check that Tailscale is connected on this phone.`
    : `Can't reach Arrgus. Check that Tailscale is connected on this phone, then pull down to try again.`;
  if (!S) { $("v-home").innerHTML = `<div class="card"><div class="empty">${online ? "Loading…" : "No status yet."}</div></div>`; return; }
  $("top-dot").className = "dot " + (online ? S.overall : "");
  $("top-label").textContent = online ? SHORT[S.overall] : "Offline";
  const nIssues = S.incidents.length, aiLive = S.ai.jobs.filter((j) => ["running", "queued"].includes(j.status)).length;
  $("badge-home").hidden = !nIssues; $("badge-home").textContent = nIssues;
  $("badge-ai").hidden = !aiLive; $("badge-ai").textContent = aiLive;
  ({home: renderHome, apps: renderApps, ai: renderAI, system: renderSystem, activity: renderActivity})[tab]();
}

function renderHome() {
  const s = S, rb = s.reboot || {}, running = s.actions.filter((a) => a.status === "running");
  let h = `<div class="card"><div class="hero2"><span class="dot ${online ? s.overall : ""}"></span><div>
      <div class="big">${esc(LABEL[s.overall])}</div>
      <div class="meta">${s.checking ? `<span class="spin"></span> checking… · ` : ""}Last check ${esc(ago(s.last_check))} ·
        ${s.results.filter((r) => r.status === "ok").length}/${s.results.length} OK${running.length ? " · " + running.map((a) => esc(a.label) + "…").join(", ") : ""}</div></div></div></div>`;
  if (!standalone() && safeGet("arrgus.app.installHidden") !== "1") {
    h += `<div class="card install"><h2>Install the app</h2>
      <p class="detail" style="margin:0 0 10px">${/iphone|ipad/i.test(navigator.userAgent)
        ? "In Safari, tap <b>Share</b> and then <b>Add to Home Screen</b>."
        : "Open your browser's menu and choose <b>Install app</b> or <b>Add to Home screen</b>."}</p>
      <div class="buttons">${deferredInstall ? `<button class="btn primary" id="b-install">Install</button>` : ""}<button class="btn small" id="b-install-hide">Not now</button></div></div>`;
  }
  if (rb.required || rb.scheduled || rb.rebooting) {
    h += `<div class="card"><h2 style="color:var(--warn)">Reboot ${rb.scheduled || rb.rebooting ? "in progress" : "needed"}</h2>
      <div class="detail">${rb.scheduled ? `Rebooting in ${rb.scheduled.seconds_left}s.` : rb.rebooting ? "Rebooting now…" : "Pending: " + esc((rb.packages || []).join(", "))}
      ${rb.kernel_new && rb.kernel_new !== rb.kernel_running ? `<br>Kernel ${esc(rb.kernel_running)} → ${esc(rb.kernel_new)}` : ""}</div>
      <div style="margin-top:10px"><button class="btn danger" data-act="reboot">${rb.scheduled || rb.rebooting ? "Show progress" : "Reboot now"}</button></div></div>`;
  }
  if (s.incidents.length) {
    h += `<div class="card issue"><h2 style="color:var(--fail)">Open issues</h2>` + s.incidents.map((i) => `<div class="row">
      <div class="pip fail"></div><div class="grow"><div class="name">${esc(i.name)}</div>
      <div class="detail">${esc(i.detail)} · since ${esc(when(i.opened))} · fix attempts ${i.attempts}${i.ai_runs ? ", AI runs " + i.ai_runs : ""}${i.last_fixer ? " · last: " + esc(i.last_fixer) : ""}</div></div></div>`).join("") + `</div>`;
  }
  h += updatesHtml(s);
  const aiOff = !s.ai.enabled;
  h += `<div class="card"><h2>Actions</h2><div class="actions">
    <button class="btn primary" data-act="report" ${aiOff ? "disabled" : ""}>Report an issue</button>
    <button class="btn" data-act="ask" ${aiOff ? "disabled" : ""}>Ask AI</button>
    <button class="btn" data-act="check" ${s.checking ? "disabled" : ""}>${s.checking ? `<span class="spin"></span> Checking` : "System check"}</button>
    <button class="btn" data-act="versions" ${s.updates.checking ? "disabled" : ""}>${s.updates.checking ? `<span class="spin"></span> Checking` : "Version check"}</button>
    <button class="btn${rb.required ? " danger" : ""}" data-act="reboot">${rb.required ? `<span class="badge"></span> ` : ""}Reboot</button>
    <a class="btn wide" href="/settings?from=app">Settings</a></div></div>`;
  h += notifHtml();

function spark(vals) {

  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <polyline points="0,${h} ${pts} ${w},${h}" class="area" stroke="none"/>

}

document.addEventListener("click", async (ev) => {

    if (a === "versions") { try { await api("/api/versions", {}); toast("Version check started"); refresh(); } catch (e) { toast(e.message); } return; }

(() => {

let threadSig = "", openSteps = new Set(), fuTarget = null, threadTimer = null, threadId = null;
function turnHtml(j) {
  const steps = j.transcript.filter((s) => s.type === "tool").length, live = ["queued", "running"].includes(j.status), open = openSteps.has(j.id);
  let body = j.transcript.map((s) => s.type === "text" ? (s.text ? `<div class="t-text">${esc(s.text)}</div>` : "")

  }

    <div class="turn-bar"><span>${progress || esc(when(j.created))}</span>${steps ? `<button class="btn small" data-steps="${esc(j.id)}">${open ? "Hide" : "Show"} steps (${steps})</button>` : ""}</div>
    ${body}${card}</div>`;
}
function openThread(id) {
  openSheet("AI conversation", `<div id="th-tr"><div class="empty">Loading…</div></div>`,
    `<div class="composer"><textarea id="fu-text" placeholder="Reply or ask a follow-up…" rows="1"></textarea>
      <button class="btn primary" id="fu-go" disabled>Send</button></div><div class="note" id="fu-note"></div>`);
  threadId = id; threadSig = ""; openSteps = new Set(); fuTarget = null;
  sheetCleanup = () => { clearTimeout(threadTimer); threadId = null; };
  const ta = $("fu-text"); ta.addEventListener("input", () => autosize(ta));
  $("fu-go").onclick = async () => {
    const text = ta.value.trim(); if (!text || !fuTarget) return;
    $("fu-go").disabled = true;
    try { const r = await api("/api/ai/followup", {job: fuTarget, text}); ta.value = ""; autosize(ta); fuTarget = null;
          toast(r.position > 1 ? `Queued (position ${r.position})` : "Sent"); threadSig = ""; clearTimeout(threadTimer); pollThread(id); }
    catch (e) { toast(e.message); $("fu-go").disabled = false; }
  };
  pollThread(id);
}
async function pollThread(id) {
  if (threadId !== id) return;
  let th;
  try { th = await api(`/api/ai/thread/${encodeURIComponent(id)}`); }
  catch (e) { $("fu-note").textContent = e.message; threadTimer = setTimeout(() => pollThread(id), 5000); return; }
  if (threadId !== id) return;
  const last = th.turns[th.turns.length - 1], live = ["queued", "running"].includes(last.status);
  const sig = JSON.stringify(th.turns.map((j) => [j.id, j.status, j.transcript.length])) + th.can_follow_up;
  if (sig !== threadSig) {
    threadSig = sig;
    $("sheet-title").textContent = th.title;
    const box = $("sheet-b"), atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    $("th-tr").innerHTML = th.turns.map(turnHtml).join("");
    if (atBottom || live) box.scrollTop = box.scrollHeight;
  }
  fuTarget = th.can_follow_up ? last.id : null;
  $("fu-go").disabled = !th.can_follow_up;
  $("fu-note").textContent = th.can_follow_up ? "" : live ? `${S?.ai?.agent_name || "The AI"} is still replying. You can type now and send when it finishes.` : (th.follow_up_error || "");
  threadTimer = setTimeout(() => pollThread(id), live ? 2000 : 8000);
}

// ---------- reboot ----------
let rbTimer = null, rbStarted = null, rbSince = null;
async function doReboot() {
  const rb = (S && S.reboot) || {};
  if (!(rb.scheduled || rb.rebooting)) {
    if (!online) return toast("Can't reach Arrgus right now");
    const kern = rb.kernel_new && rb.kernel_new !== rb.kernel_running ? `\nKernel: ${rb.kernel_running} → ${rb.kernel_new}` : "";
    if (!confirm(`Reboot ${S ? S.box : "the server"} now?\n\nEvery app goes offline for a few minutes.` +
                 (rb.required ? `\nPending: ${(rb.packages || []).join(", ")}${kern}` : "\n(No reboot is currently pending.)") + "\n\nYou get 15 seconds to cancel.")) return;
    let body = {};
    for (;;) {
      try { await api("/api/reboot", body); break; }
      catch (e) {
        if (body.force || !/running|being applied/.test(e.message) || !confirm(e.message + "\n\nReboot anyway? It will be interrupted.")) return toast(e.message);
        body = {force: true};
      }
    }
    rbStarted = S && S.started; rbSince = Date.now();
  }
  rbStarted = rbStarted || (S && S.started); rbSince = rbSince || Date.now();
  openSheet("Reboot", `<div class="bigcount" id="rb-count"></div><p class="detail" style="text-align:center" id="rb-hint"></p>`,
    `<button class="btn danger" id="rb-cancel" style="width:100%;justify-content:center;min-height:48px">Cancel reboot</button>`);
  sheetCleanup = () => clearTimeout(rbTimer);
  $("rb-cancel").onclick = async () => {
    try { await api("/api/reboot/cancel", {}); toast("Reboot cancelled"); rbStarted = rbSince = null; closeSheet(); } catch (e) { toast(e.message); }
  };
  rebootPoll();
}
async function rebootPoll() {
  let st = null;
  try { st = await api("/api/status", undefined, 5000); } catch {}
  const el = (id) => document.getElementById(id), secs = Math.round((Date.now() - (rbSince || Date.now())) / 1000);
  const mmss = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")}`;
  if (!el("rb-count")) return;
  if (st && rbStarted && st.started !== rbStarted) {
    el("rb-count").textContent = "Back up"; el("rb-hint").textContent = `Took ${mmss}.`; el("rb-cancel").hidden = true;
    rbStarted = rbSince = null; S = st; return setTimeout(() => closeSheet(), 2500);
  }
  const rb = st && st.reboot;
  if (st && !rb.scheduled && !rb.rebooting) { rbStarted = rbSince = null; return closeSheet(); }
  if (rb && rb.scheduled && !rb.rebooting) {
    el("rb-count").textContent = rb.scheduled.seconds_left + "s";
    el("rb-hint").textContent = "Rebooting soon. Arrgus pushes the log to GitHub first.";
  } else {
    el("rb-count").innerHTML = `<span class="spin" style="width:28px;height:28px;border-width:3px"></span>`;
    el("rb-hint").textContent = `Rebooting… waiting for the server to come back (${mmss}).`;
    el("rb-cancel").hidden = true;
  }
  rbTimer = setTimeout(rebootPoll, st && rb && rb.scheduled && !rb.rebooting ? 1000 : 4000);
}

// ---------- notifications ----------
// N: what this phone knows about notifications. Loaded once, then after each change.
let N = {loading: true};
const iOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function deviceName() {
  const ua = navigator.userAgent;
  const dev = /iPhone/.test(ua) ? "iPhone" : /iPad/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1) ? "iPad"
    : /Android/.test(ua) ? "Android" : /Mac/.test(ua) ? "Mac" : /Windows/.test(ua) ? "Windows PC" : /Linux/.test(ua) ? "Linux" : "Device";
  const br = /EdgA?\//.test(ua) ? "Edge" : /SamsungBrowser/.test(ua) ? "Samsung Internet" : /Firefox|FxiOS/.test(ua) ? "Firefox"
    : /Chrome|CriOS/.test(ua) ? "Chrome" : /Safari/.test(ua) ? "Safari" : "";
  return dev + (br && !(standalone() && br === "Safari") ? " · " + br : "");
}
function keyBytes(b64) {
  const raw = atob(b64.replace(/-/g, "+").replace(/_/g, "/") + "=".repeat((4 - b64.length % 4) % 4));
  return Uint8Array.from(raw, (ch) => ch.charCodeAt(0));
}
async function loadNotif() {
  const n = {};
  n.supported = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
  n.perm = "Notification" in window ? Notification.permission : "unsupported";
  try { n.info = await api("/api/push"); } catch (e) { n.error = e.message; }
  if (n.supported) {
    try {
      const reg = await navigator.serviceWorker.ready;
      n.sub = await reg.pushManager.getSubscription();
      if (n.sub && n.info && n.info.available) {
        const st = await api("/api/push/status", {endpoint: n.sub.endpoint});
        n.server = st.subscribed ? st : null;
      }
    } catch (e) { n.error = n.error || e.message; }
  }
  N = n;
  if (tab === "home") render();
}
function notifHtml() {
  const n = N;
  let inner;
  if (n.loading) inner = `<div class="empty">Checking…</div>`;
  else if (iOS && !standalone()) inner = `<p class="detail" style="margin:0">On iPhone and iPad, notifications work once Arrgus is on your home screen.
      Install it (Share → Add to Home Screen), open it from there, and turn them on here.</p>`;
  else if (!n.supported) inner = `<p class="detail" style="margin:0">This browser can't receive notifications.</p>`;
  else if (n.info && !n.info.available) inner = `<p class="detail" style="margin:0">Notifications aren't available on the server yet. ${esc(n.info.reason)}</p>`;
  else if (!n.info) inner = `<p class="detail" style="margin:0">${esc(n.error || "Can't reach Arrgus.")}</p>`;
  else if (n.perm === "denied") inner = `<p class="detail" style="margin:0">Notifications for Arrgus are blocked. Allow them in your phone's settings
      (${iOS ? "Settings → Notifications → Arrgus" : "Settings → Apps → your browser or Arrgus → Notifications"}), then come back.</p>`;
  else if (!n.sub || !n.server) inner = `<p class="detail" style="margin:0 0 10px">Get a notification on this ${esc(deviceName().split(" · ")[0])} when something needs you.</p>
      <button class="btn primary" style="width:100%;justify-content:center;min-height:48px" data-notif="on">Turn on notifications</button>`;
  else {
    const cats = n.info.categories;
    inner = `<p class="detail" style="margin:0 0 8px">On for this device (“${esc(n.server.name)}”). Notify me about:</p>
      <div style="display:grid;gap:6px">${Object.keys(cats).map((k) => `<label class="tg" style="justify-content:flex-start;min-height:44px">
        <input type="checkbox" data-notifcat="${k}" ${n.server.prefs[k] ? "checked" : ""}> ${esc(cats[k].label)}</label>`).join("")}</div>
      <div class="actions" style="margin-top:10px"><button class="btn" data-notif="test">Send test</button><button class="btn" data-notif="off">Turn off</button></div>
      ${n.server.last && !n.server.last.ok ? `<p class="note" style="color:var(--warn)">Last delivery failed: ${esc(n.server.last.detail)}</p>` : ""}`;
  }
  return `<div class="card"><h2>Notifications</h2>${inner}</div>`;
}
document.addEventListener("click", async (ev) => {
  const b = ev.target.closest("[data-notif]");
  if (!b || b.disabled) return;
  const what = b.dataset.notif;
  b.disabled = true;
  try {
    if (what === "on") {
      const perm = await Notification.requestPermission();
      if (perm !== "granted") { toast(perm === "denied" ? "Notifications were blocked" : "Notifications not allowed"); }
      else {
        const reg = await navigator.serviceWorker.ready;
        let sub = await reg.pushManager.getSubscription();
        if (!sub) sub = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: keyBytes(N.info.public_key)});
        await api("/api/push/subscribe", {subscription: sub.toJSON(), name: deviceName()});
        toast("Notifications on");
      }
    } else if (what === "test") {
      const r = await api("/api/push/test", {endpoint: N.sub.endpoint}, 30000);
      toast(r.ok ? "Test sent. It should arrive in a few seconds." : "Couldn't send: " + r.detail);
    } else if (what === "off") {
      try { await api("/api/push/unsubscribe", {endpoint: N.sub.endpoint}); } catch {}
      try { await N.sub.unsubscribe(); } catch {}
      toast("Notifications off");
    }
  } catch (e) { toast(e.message); }
  b.disabled = false;
  loadNotif();
});
document.addEventListener("change", async (ev) => {
  const c = ev.target.closest("[data-notifcat]");
  if (!c) return;
  try { const r = await api("/api/push/prefs", {endpoint: N.sub.endpoint, prefs: {[c.dataset.notifcat]: c.checked}}); N.server = r; }
  catch (e) { toast(e.message); c.checked = !c.checked; }
});

// opened from a notification: /app?job=<id> opens that AI conversation
function openFromUrl(u) {
  let url; try { url = new URL(u, location.origin); } catch { return; }
  const job = url.searchParams.get("job");
  if (job) { showTab("ai"); openThread(job); } else { if (sheetOpen()) closeSheet(); showTab("home"); }
  refresh();
}
if ("serviceWorker" in navigator) navigator.serviceWorker.addEventListener("message", (e) => { if (e.data && e.data.open) openFromUrl(e.data.open); });

// ---------- layout diagnostics: the app reports its screen measurements so layout problems can be fixed
// without a screenshot (numbers only; kept on the server in state/app_diag.json) ----------
function reportLayout(reason) {
  try {
    const probe = document.createElement("div");
    probe.style.cssText = "position:fixed;top:0;left:0;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)";
    document.body.appendChild(probe);
    const cs = getComputedStyle(probe), px = (v) => Math.round(parseFloat(v) || 0);
    const inset = {top: px(cs.paddingTop), right: px(cs.paddingRight), bottom: px(cs.paddingBottom), left: px(cs.paddingLeft)};
    probe.remove();
    const r = (sel) => { const e = document.querySelector(sel); if (!e) return null; const b = e.getBoundingClientRect(); return {top: Math.round(b.top), bottom: Math.round(b.bottom), h: Math.round(b.height)}; };
    const vv = window.visualViewport;
    api("/api/app/layout", {reason, ua: navigator.userAgent, standalone: standalone(), status_bar: document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')?.content,
      dpr: window.devicePixelRatio, screen: [screen.width, screen.height], inner: [innerWidth, innerHeight], outer_h: outerHeight,
      client_h: document.documentElement.clientHeight, vv: vv ? {h: Math.round(vv.height), top: Math.round(vv.offsetTop)} : null, inset,
      body: r("body"), top_bar: r(".ab-top"), tab_bar: r(".ab-tabs"), tab_icon: r(".ab-tabs button svg")}).catch(() => {});
  } catch {}
}
setTimeout(() => reportLayout("load"), 1500);
let layoutT = null;
window.addEventListener("resize", () => { clearTimeout(layoutT); layoutT = setTimeout(() => reportLayout("resize"), 800); });

// ---------- install + offline support ----------
let deferredInstall = null;
const standalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferredInstall = e; render(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/app/sw.js", {scope: "/app"}).catch(() => {});

showTab(["home", "apps", "ai", "system", "activity"].includes(tab) ? tab : "home");
refresh();
loadNotif();
if (new URLSearchParams(location.search).get("job")) {
  openFromUrl(location.href);
  history.replaceState(history.state, "", "/app");
}
</script>
</body>
