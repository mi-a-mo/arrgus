# Example Arrgus config for a new box. Copy to config/<box>.toml and edit.
# Only [box] is required; every other section has defaults.

[box]
name = "mybox"                       # used in the log repo name, titles and notifications
description = "What this box is and anything unusual about it (shown to the AI)."
compose_dir = "/home/me/docker"
compose_file = "docker-compose.yml"
env_file = "/home/me/docker/.env"    # values of *PASS*/*TOKEN*/*KEY*/*SECRET*/*USER* vars are scrubbed from logs

[schedule]
check_interval = 300
update_check_interval = 21600
boot_window = 900
boot_grace = 180
fix_settle = 30

[checks]
max_fix_attempts = 2
tailscale = false
mounts = []                          # e.g. ["/mnt/media"]
disk_paths = ["/"]
ignore_containers = []

# [checks.vpn]                       # optional: a VPN container other containers share a netns with
# container = "gluetun"
# dependents = ["qbittorrent"]
# probe_container = "qbittorrent"

# [[checks.http]]
# name = "Jellyfin"
# url = "http://127.0.0.1:8096/health"
# container = "jellyfin"

[ai]
enabled = true
auto_escalate = true
model = "claude-opus-5-5"
claude_bin = "~/.local/bin/claude"
permission_mode = "bypassPermissions"   # or "acceptEdits" / "default" with allowed_tools = [...]
notes_file = "/home/me/arrgus/box-notes-mybox.md"

[github]
log_dir = "/home/me/arrgus-mybox-log"
remote = ""                          # git@github.com:<user>/arrgus-mybox-log.git (private)
ssh_key = "~/.ssh/arrgus_log_github"

[web]
listen = "127.0.0.1"                 # an address only your reverse proxy can reach
port = 8765
title = "My Box"
subtitle = ""

[updates]
prune_images = true

[notify]
ntfy_url = ""

